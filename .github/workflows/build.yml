name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (Release x64)
        run: msbuild "Source Code/1.8.2 AIs.sln" /m /p:Configuration=Release /p:Platform=x64
      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: dlls
          path: "Source Code/**/x64/Release/*.dll"
